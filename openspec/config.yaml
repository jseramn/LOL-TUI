# openspec/config.yaml — SDD project configuration (generated by sdd-init, 2026-08-25)
schema: spec-driven

context: |
  Project: tui-lol - terminal UI operational intelligence dashboard for League of
  Legends matches. User inputs a match ID or live game; sees real-time metrics and
  analytics for their own play and all 10 players in the match.
  Tech stack: Rust stable 1.98 (x86_64-pc-windows-gnu), edition 2024, ratatui
  0.30.2 + crossterm 0.29.0; single-crate binary scaffold (src/main.rs).
  Testing: cargo test built-in harness; no tests exist yet; strict TDD feasible.
  Style: Conventional commits only, no AI attribution.
  Env gotcha: cargo is NOT on PATH. Every cargo/rustc invocation MUST set
  CARGO_HOME/RUSTUP_HOME/PATH and RUSTFLAGS first - use apply.test_command as the
  canonical prefix. Never write or install anything on drive C:.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - All builds stay on E: (target/ already lands on E:)
      - Use "-j 1" on cargo commands; parallel rustc hits Windows commit limit (os error 1455)
    tdd: true
    test_command: |-
      $env:CARGO_HOME='E:\rust\cargo'; $env:RUSTUP_HOME='E:\rust\rustup'; $env:Path='E:\w64devkit\w64devkit\bin;E:\rust\rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained;E:\rust\cargo\bin;'+$env:Path; $env:RUSTFLAGS='-Clink-self-contained=yes'; cargo test -j 1
  verify:
    test_command: |-
      $env:CARGO_HOME='E:\rust\cargo'; $env:RUSTUP_HOME='E:\rust\rustup'; $env:Path='E:\w64devkit\w64devkit\bin;E:\rust\rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained;E:\rust\cargo\bin;'+$env:Path; $env:RUSTFLAGS='-Clink-self-contained=yes'; cargo test -j 1
    build_command: |-
      $env:CARGO_HOME='E:\rust\cargo'; $env:RUSTUP_HOME='E:\rust\rustup'; $env:Path='E:\w64devkit\w64devkit\bin;E:\rust\rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained;E:\rust\cargo\bin;'+$env:Path; $env:RUSTFLAGS='-Clink-self-contained=yes'; cargo build -j 1
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
